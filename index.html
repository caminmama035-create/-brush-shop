<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านบรัชวาดภาพ</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1f2a5c;--mute:#6a7392;--line:#dbe1ee;--pink:#ff5c9a;--ok:#1f8f5f;--okbg:#dff5ea;--wait:#a86a00;--waitbg:#fff0cf;--bad:#c0392b;--badbg:#fde4e1}
@media (prefers-color-scheme:dark){:root{--bg:#10142b;--card:#192040;--ink:#eef1ff;--mute:#9aa4cc;--line:#2c3566;--pink:#ff7aae;--ok:#6ee0a8;--okbg:#17382b;--wait:#ffcc66;--waitbg:#3d2f10;--bad:#ff8a7a;--badbg:#4a1f1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Thai",system-ui,sans-serif}
h1,h2,h3{font-family:Mitr,"Noto Sans Thai",sans-serif;font-weight:500;margin:0 0 6px}
main{max-width:720px;margin:0 auto;padding:16px 16px 80px}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);margin:4px 0 12px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.top h1{font-size:24px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box,.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{background:var(--pink);color:#fff;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.price{font-family:Mitr,sans-serif;font-size:18px;color:var(--pink)}
.mute{color:var(--mute);font-size:14px}
.tag{border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.w{background:var(--waitbg);color:var(--wait)}.o{background:var(--okbg);color:var(--ok)}.b{background:var(--badbg);color:var(--bad)}
.c{text-align:center}
.qr{width:220px;height:220px;margin:8px auto;background:#fff;padding:8px;border-radius:12px}
.qr svg{width:100%;height:100%}
a{color:var(--pink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;z-index:9}
</style>
</head>
<body>
<main id="app"><p class="mute">กำลังโหลด...</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var SB_URL="https://fxgwjejyumeqenzaldjf.supabase.co";
var SB_KEY="sb_publishable_fNF7BdFYuxLV0ZttS80X_w_wdQWzWrX";
var PAY={phone:"0885542388",name:"atha lorlaem"};
var sb=supabase.createClient(SB_URL,SB_KEY);
var S={user:null,admin:false,tab:"shop",mode:"login",cart:[],products:[],orders:[],links:{},all:[],busy:false};
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function total(){return S.cart.reduce(function(a,i){return a+i.price},0)}
function tlv(i,v){return i+String(v.length).padStart(2,"0")+v}
function crc16(s){var c=65535,i,j;for(i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(j=0;j<8;j++)c=(c&32768)?((c<<1)^4129):(c<<1);c&=65535}return c.toString(16).toUpperCase().padStart(4,"0")}
function ppQR(phone,amt){var t="0066"+phone.replace(/^0/,"");var m=tlv("00","A000000677010111")+tlv("01",t);var p=tlv("00","01")+tlv("01","12")+tlv("29",m)+tlv("53","764")+tlv("54",amt.toFixed(2))+tlv("58","TH")+"6304";p+=crc16(p);var q=qrcode(0,"M");q.addData(p);q.make();return q.createSvgTag(4,0)}
function stTag(s){return s==="approved"?'<span class="tag o">ส่งไฟล์แล้ว</span>':s==="rejected"?'<span class="tag b">ไม่ผ่านการตรวจ</span>':'<span class="tag w">รอตรวจสลิป</span>'}
function fmt(d){return new Date(d).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"})}

async function boot(){
 var r=await sb.auth.getSession();
 await setUser(r.data.session?r.data.session.user:null);
 sb.auth.onAuthStateChange(function(e,s){var u=s?s.user:null;if((u&&u.id)!==(S.user&&S.user.id))setUser(u)});
}
async function setUser(u){
 S.user=u;S.admin=false;S.cart=[];S.tab="shop";
 if(u){
  var a=await sb.from("admins").select("user_id").eq("user_id",u.id).maybeSingle();
  S.admin=!!a.data;
  await loadProducts();
 }
 render();
}
async function loadProducts(){
 var r=await sb.from("products").select("*").order("name");
 S.products=r.data||[];
}
async function loadOrders(){
 var r=await sb.from("orders").select("*, order_items(price, product_id, products(name))").eq("user_id",S.user.id).order("created_at",{ascending:false});
 S.orders=r.data||[];
 var l=await sb.from("product_files").select("product_id, drive_url");
 S.links={};(l.data||[]).forEach(function(x){S.links[x.product_id]=x.drive_url});
}
async function loadAll(){
 var r=await sb.from("orders").select("*, order_items(price, product_id, products(name))").order("created_at",{ascending:false});
 S.all=r.data||[];
}
async function go(t){
 S.tab=t;
 if(t==="orders")await loadOrders();
 if(t==="admin")await loadAll();
 if(t==="manage")await loadProducts();
 render();
}
function render(){
 var a=$("#app");
 if(!S.user){a.innerHTML=authView();bindAuth();return}
 var tabs=[["shop","สินค้า"],["cart","ตะกร้า ("+S.cart.length+")"],["orders","คำสั่งซื้อของฉัน"]];
 if(S.admin)tabs.push(["admin","แอดมิน: ตรวจสลิป"],["manage","แอดมิน: จัดการสินค้า"]);
 var nav='<nav>'+tabs.map(function(t){return '<button data-t="'+t[0]+'"'+(S.tab===t[0]||(S.tab==="pay"&&t[0]==="cart")?' aria-current="true"':"")+'>'+t[1]+'</button>'}).join("")+'</nav>';
 var h='<div class="top"><h1>ร้านบรัชวาดภาพ</h1><button class="btn ghost" id="lo">ออกจากระบบ</button></div><div class="mute" style="margin-bottom:8px">'+esc(S.user.email)+'</div>'+nav;
 h+=({shop:shopV,cart:cartV,pay:payV,orders:ordersV,admin:adminV,manage:manageV}[S.tab]||shopV)();
 a.innerHTML=h;
 $("#lo").onclick=function(){sb.auth.signOut()};
 $("nav").onclick=function(e){if(e.target.dataset.t)go(e.target.dataset.t)};
 bindMain();
}
function authView(){
 var su=S.mode==="signup";
 return '<div class="top"><h1>ร้านบรัชวาดภาพ</h1></div><div class="box"><h2>'+(su?"สมัครสมาชิก":"เข้าสู่ระบบ")+'</h2><p class="mute">ต้องเข้าสู่ระบบด้วยอีเมลก่อนจึงจะสั่งซื้อและรับไฟล์ได้</p><label for="em">อีเมล</label><input id="em" type="email" autocomplete="email"><label for="pw">รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="pw" type="password" autocomplete="'+(su?"new-password":"current-password")+'"><button class="btn" id="go">'+(su?"สมัครสมาชิก":"เข้าสู่ระบบ")+'</button> <button class="btn ghost" id="sw">'+(su?"มีบัญชีแล้ว":"สมัครสมาชิกใหม่")+'</button></div>'
}
function bindAuth(){
 $("#sw").onclick=function(){S.mode=S.mode==="signup"?"login":"signup";render()};
 $("#go").onclick=async function(){
  var e=$("#em").value.trim(),p=$("#pw").value;
  if(e.indexOf("@")<1||p.length<6){toast("กรอกอีเมลและรหัสผ่านให้ครบ (รหัสอย่างน้อย 6 ตัว)");return}
  var r=S.mode==="signup"?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){toast(S.mode==="signup"?"สมัครไม่สำเร็จ: "+r.error.message:"อีเมลหรือรหัสผ่านไม่ถูกต้อง");return}
  if(S.mode==="signup"&&!r.data.session)toast("สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ");
 };
}
function shopV(){
 if(!S.products.length)return '<div class="box c"><p>ยังไม่มีสินค้า</p></div>';
 return S.products.filter(function(p){return p.active}).map(function(p){
  return '<div class="item"><h3>'+esc(p.name)+'</h3><div class="mute">'+esc(p.description)+'</div><div class="row" style="border:0;padding-top:10px"><span class="price">฿'+p.price+'</span><button class="btn" data-add="'+p.id+'">ใส่ตะกร้า</button></div></div>'}).join("");
}
function cartV(){
 if(!S.cart.length)return '<div class="box c"><p>ตะกร้ายังว่างอยู่</p><button class="btn" data-t2="shop">เลือกสินค้า</button></div>';
 return '<div class="box"><h2>ตะกร้า</h2>'+S.cart.map(function(x,i){return '<div class="row"><span>'+esc(x.name)+'</span><span>฿'+x.price+' <button class="btn ghost" data-rm="'+i+'">ลบ</button></span></div>'}).join("")+'<div class="row"><b>รวม</b><span class="price">฿'+total()+'</span></div><button class="btn" data-t2="pay">ไปหน้าชำระเงิน</button></div>';
}
function payV(){
 if(!S.cart.length)return cartV();
 return '<div class="box c"><h2>สแกนจ่าย ฿'+total()+'</h2><div class="qr" role="img" aria-label="QR พร้อมเพย์">'+ppQR(PAY.phone,total())+'</div><p class="mute">พร้อมเพย์ '+esc(PAY.phone)+' ชื่อบัญชี '+esc(PAY.name)+'<br>หรือทรูมันนี่วอเล็ต เบอร์เดียวกัน (โอนยอด ฿'+total()+')</p><div style="text-align:left"><label for="sl">แนบสลิปหลังโอนเงิน</label><input id="sl" type="file" accept="image/*"></div><button class="btn" id="sp">ส่งสลิป</button></div>';
}
function ordersV(){
 if(!S.orders.length)return '<div class="box c"><p>ยังไม่มีคำสั่งซื้อ</p></div>';
 return S.orders.map(function(o){
  var items=(o.order_items||[]).map(function(i){return esc(i.products?i.products.name:"สินค้า")}).join(", ");
  var links="";
  if(o.status==="approved")links=(o.order_items||[]).map(function(i){var u=S.links[i.product_id];return u?'<div class="row"><span>'+esc(i.products?i.products.name:"")+'</span><a href="'+esc(u)+'" target="_blank" rel="noopener">เปิดลิงก์ไฟล์</a></div>':""}).join("");
  return '<div class="box"><div class="row" style="border:0"><span><b>#'+o.id+'</b> ฿'+o.total+'<br><span class="mute">'+fmt(o.created_at)+'</span></span>'+stTag(o.status)+'</div><div class="mute">'+items+'</div>'+links+'</div>';
 }).join("");
}
function adminV(){
 if(!S.all.length)return '<div class="box c"><p>ยังไม่มีออเดอร์</p></div>';
 return S.all.map(function(o){
  var items=(o.order_items||[]).map(function(i){return esc(i.products?i.products.name:"สินค้า")}).join(", ");
  var act=o.status==="pending"?'<div style="margin-top:8px"><button class="btn ghost" data-slip="'+esc(o.slip_path)+'">ดูสลิป</button> <button class="btn" data-ok="'+o.id+'">อนุมัติและส่งไฟล์</button> <button class="btn ghost" data-no="'+o.id+'">ไม่ผ่าน</button></div>':'<div style="margin-top:8px"><button class="btn ghost" data-slip="'+esc(o.slip_path)+'">ดูสลิป</button></div>';
  return '<div class="box"><div class="row" style="border:0"><span><b>#'+o.id+'</b> ฿'+o.total+'<br><span class="mute">'+esc(o.email)+' · '+fmt(o.created_at)+'</span></span>'+stTag(o.status)+'</div><div class="mute">'+items+'</div>'+act+'<p class="mute">ก่อนอนุมัติ เทียบยอดกับแอปธนาคารหรือทรูมันนี่ของคุณทุกครั้ง</p></div>';
 }).join("");
}
function manageV(){
 var f='<div class="box"><h2>เพิ่มสินค้า</h2><label for="pn">ชื่อสินค้า</label><input id="pn"><label for="pd">คำอธิบาย</label><textarea id="pd" rows="3"></textarea><label for="pp">ราคา (บาท)</label><input id="pp" type="number" inputmode="numeric"><label for="pl">ลิงก์ไดร์ฟของไฟล์</label><input id="pl" type="url" placeholder="https://drive.google.com/..."><button class="btn" id="pa">บันทึกสินค้า</button></div>';
 var l=S.products.map(function(p){return '<div class="row"><span>'+esc(p.name)+' ฿'+p.price+(p.active?"":' <span class="tag b">ซ่อนอยู่</span>')+'</span><button class="btn ghost" data-tg="'+p.id+'">'+(p.active?"ซ่อน":"แสดง")+'</button></div>'}).join("");
 return f+'<div class="box"><h2>สินค้าทั้งหมด</h2>'+(l||'<p class="mute">ยังไม่มีสินค้า</p>')+'</div>';
}
function bindMain(){
 var a=$("#app");
 a.onclick=async function(e){
  var d=e.target.dataset;if(!d)return;
  if(d.add){var p=S.products.filter(function(x){return x.id===d.add})[0];S.cart.push(p);toast("เพิ่มลงตะกร้าแล้ว");render()}
  if(d.rm){S.cart.splice(+d.rm,1);render()}
  if(d.t2)go(d.t2);
  if(d.slip){var r=await sb.storage.from("slips").createSignedUrl(d.slip,300);if(r.data)window.open(r.data.signedUrl,"_blank");else toast("เปิดสลิปไม่ได้")}
  if(d.ok||d.no){var r2=await sb.from("orders").update({status:d.ok?"approved":"rejected"}).eq("id",d.ok||d.no);if(r2.error)toast("บันทึกไม่สำเร็จ: "+r2.error.message);else{toast(d.ok?"อนุมัติแล้ว ลูกค้าจะเห็นลิงก์ไฟล์":"บันทึกแล้ว");go("admin")}}
  if(d.tg){var p2=S.products.filter(function(x){return x.id===d.tg})[0];await sb.from("products").update({active:!p2.active}).eq("id",d.tg);go("manage")}
 };
 if($("#sp"))$("#sp").onclick=submitOrder;
 if($("#pa"))$("#pa").onclick=addProduct;
}
async function submitOrder(){
 if(S.busy)return;
 var f=$("#sl").files[0];
 if(!f){toast("แนบสลิปก่อนส่ง");return}
 S.busy=true;$("#sp").disabled=true;
 try{
  var ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";
  var path=S.user.id+"/"+Date.now()+"."+ext;
  var up=await sb.storage.from("slips").upload(path,f);
  if(up.error)throw up.error;
  var o=await sb.from("orders").insert({user_id:S.user.id,email:S.user.email,total:total(),slip_path:path}).select().single();
  if(o.error)throw o.error;
  var it=await sb.from("order_items").insert(S.cart.map(function(x){return {order_id:o.data.id,product_id:x.id,price:x.price}}));
  if(it.error)throw it.error;
  S.cart=[];toast("ส่งสลิปแล้ว รอตรวจสอบ");await go("orders");
 }catch(err){toast("ส่งไม่สำเร็จ: "+(err.message||err));$("#sp").disabled=false}
 S.busy=false;
}
async function addProduct(){
 var n=$("#pn").value.trim(),d=$("#pd").value.trim(),p=parseInt($("#pp").value,10),l=$("#pl").value.trim();
 if(!n||!(p>0)||l.indexOf("http")!==0){toast("กรอกชื่อ ราคา และลิงก์ให้ครบ");return}
 var r=await sb.from("products").insert({name:n,description:d,price:p}).select().single();
 if(r.error){toast("บันทึกไม่สำเร็จ: "+r.error.message);return}
 var r2=await sb.from("product_files").insert({product_id:r.data.id,drive_url:l});
 if(r2.error){toast("บันทึกลิงก์ไม่สำเร็จ: "+r2.error.message);return}
 toast("เพิ่มสินค้าแล้ว");go("manage");
}
boot();
</script>
</body>
</html>
