<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แมวดำตัวอ้วน</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbf4fb;--card:#fff;--ink:#4a3f6b;--mute:#8a7fa8;--line:#eadcf2;--pink:#f08ab8;--lav:#d9c8f5;--mint:#cdeee0;--ok:#2f8f6a;--okbg:#d9f4e8;--wait:#a1700f;--waitbg:#fff1d2;--bad:#c25364;--badbg:#fde1e6}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f3e8fb 0,#fdf1f7 220px,var(--bg) 480px) no-repeat,var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Thai",system-ui,sans-serif}
h1,h2,h3{font-family:Mitr,"Noto Sans Thai",sans-serif;font-weight:500;margin:0 0 6px}
main{max-width:720px;margin:0 auto;padding:16px 16px 80px}
button,input,textarea{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);margin:4px 0 12px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.top h1{font-size:24px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
nav button[aria-current="true"]{background:var(--lav);color:var(--ink);border-color:var(--lav);font-weight:600}
.box,.item{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(160,120,200,.10)}
.item{padding:0;overflow:hidden}.item .in{padding:14px 16px 12px}
.lay{display:flex;gap:6px;margin:0 0 12px}.lay button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:14px}.lay button[aria-pressed="true"]{background:var(--lav);border-color:var(--lav);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .item{margin:0;display:flex;flex-direction:column}.grid .in{padding:10px 12px 10px;flex:1;display:flex;flex-direction:column}.grid h3{font-size:15px;line-height:1.35}.grid .cover{aspect-ratio:1/1}.grid .mute{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.grid .row{flex-wrap:wrap;margin-top:auto}.grid .btn{padding:7px 12px;font-size:14px}
.pv{display:inline-block;margin-top:8px;font-size:14px}
.cover{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#f3e8fb}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;border-radius:50%;background:#f3e8fb;border:2px solid #fff;box-shadow:0 2px 8px rgba(160,120,200,.3)}
.btn{background:linear-gradient(135deg,#f6a0c6,#c9a8f0);color:#fff;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.price{font-family:Mitr,sans-serif;font-size:19px;color:#e56aa3}
.mute{color:var(--mute);font-size:14px}
.tag{border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.w{background:var(--waitbg);color:var(--wait)}.o{background:var(--okbg);color:var(--ok)}.b{background:var(--badbg);color:var(--bad)}
.c{text-align:center}
.qr{width:220px;height:220px;margin:8px auto;background:#fff;padding:8px;border-radius:12px}
.qr svg{width:100%;height:100%}
a{color:#b06ad8;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:9}

/* ===== ลูกเล่นตกแต่ง ===== */
body{overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:320px;height:320px;background:#f7c6de;left:-90px;top:-60px}
.bgfx i:nth-child(2){width:280px;height:280px;background:#d9c8f5;right:-80px;top:180px;animation-duration:22s}
.bgfx i:nth-child(3){width:260px;height:260px;background:#cdeee0;left:20%;bottom:-120px;animation-duration:26s}
.bgfx b{position:absolute;color:#e9a6cf;font-size:14px;animation:twinkle 3.2s ease-in-out infinite}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0)}50%{opacity:.9;transform:scale(1.1) rotate(20deg)}}
.top{position:sticky;top:0;z-index:5;margin:-16px -16px 10px;padding:12px 16px;background:rgba(251,244,251,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(234,220,242,.7)}
.brand img{animation:bob 3.4s ease-in-out infinite;cursor:pointer;transition:transform .2s}
.brand img.wig{animation:wiggle .6s ease}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.1)}40%{transform:rotate(12deg) scale(1.15)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.top h1{background:linear-gradient(90deg,#7b5ea7,#e56aa3,#9a7be0,#7b5ea7);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin-bottom:14px;color:#fff;background:linear-gradient(120deg,#f4a3c9,#c7a6f2,#a8d8f0,#f4a3c9);background-size:300% 300%;animation:flow 12s ease infinite;box-shadow:0 10px 28px rgba(200,140,220,.35)}
.hero h2{font-size:20px;margin:0 0 2px;text-shadow:0 2px 8px rgba(120,60,150,.25)}
.hero p{margin:0;font-size:14px;opacity:.95}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 4.5s ease-in-out infinite}
.hero .paw{position:absolute;right:14px;bottom:6px;font-size:34px;opacity:.8;animation:bob 2.8s ease-in-out infinite}
@keyframes flow{50%{background-position:100% 50%}}
@keyframes sweep{60%,100%{transform:translateX(100%)}}
nav button,.lay button{transition:background .25s,transform .15s,box-shadow .25s}
nav button:active,.lay button:active{transform:scale(.94)}
nav button[aria-current="true"],.lay button[aria-pressed="true"]{box-shadow:0 4px 12px rgba(170,130,230,.35)}
nav button.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.18);background:#f7c6de}}
.item,.box{transition:transform .25s ease,box-shadow .25s ease}
.item:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(170,120,210,.22)}
.item .cover{transition:transform .5s ease}
.item:hover .cover{transform:scale(1.06)}
.enter .item,.enter .box,.enter .hero{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
.btn{position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s,filter .2s;background-size:200% 200%}
.btn:not(.ghost):hover{box-shadow:0 6px 16px rgba(230,120,180,.35);filter:saturate(1.15)}
.btn:active{transform:scale(.95)}
.btn:not(.ghost)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.btn:not(.ghost):hover::after{transform:translateX(120%)}
.price{display:inline-block;background:linear-gradient(135deg,#fde4f1,#efe4fd);padding:2px 12px;border-radius:999px;font-size:17px}
.toast{animation:toastin .45s cubic-bezier(.3,1.6,.5,1);box-shadow:0 10px 26px rgba(74,63,107,.3)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,24px) scale(.9)}}
.spark{position:fixed;pointer-events:none;z-index:20;font-size:16px;animation:spark .8s ease-out forwards}
@keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(90deg)}}
.conf{position:fixed;top:-10px;width:9px;height:14px;border-radius:3px;z-index:30;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== สติกเกอร์ ===== */
.stk{display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.flt .stk{width:100%;height:auto}.flt{position:absolute;opacity:.85;animation:floaty var(--d,7s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) * -1))}}
.hero{min-height:100px;padding-right:110px}.hero::after{pointer-events:none}
.hero .hst{position:absolute;right:10px;bottom:2px;width:88px;animation:bob 3s ease-in-out infinite;pointer-events:auto;cursor:pointer;z-index:1}
.hero .crab{position:absolute;bottom:4px;top:auto;left:0;width:26px;animation:walk 11s linear infinite}
@keyframes walk{from{transform:translateX(-40px)}to{transform:translateX(760px)}}
.hero .hst.wig{animation:wiggle .6s ease}
.empty img{width:80px;margin:4px auto 8px;animation:bob 3s ease-in-out infinite}
.authdeco{position:relative;margin-top:34px}.authdeco .a1{position:absolute;right:-4px;top:-38px;width:72px;animation:bob 3.6s ease-in-out infinite}.authdeco .a2{position:absolute;left:-6px;top:-30px;width:54px;--r:-8deg;animation:floaty 5s ease-in-out infinite}
.seabed{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:30px 0 0}
.seabed img{width:44px;animation:bob 3.2s ease-in-out infinite}.seabed img:nth-child(2n){animation-delay:.6s;width:36px}.seabed img:nth-child(3n){animation-delay:1.2s;width:50px}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:6px}
.load{text-align:center;padding:60px 0}.load img{width:90px;margin:0 auto 8px;animation:bob 1.2s ease-in-out infinite}
.rainst{position:fixed;top:-80px;width:56px;z-index:30;pointer-events:none}
.ost{display:flex;gap:12px;align-items:center}.ost img{width:64px;flex:none;animation:bob 3s ease-in-out infinite}.ost .ob{flex:1;min-width:0}
.thx{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(74,63,107,.25);animation:fadein .3s}.thx div{background:#fff;border-radius:24px;padding:22px 26px;text-align:center;box-shadow:0 14px 40px rgba(74,63,107,.3);animation:popin .5s cubic-bezier(.3,1.6,.5,1)}.thx img{width:150px;margin:0 auto 6px;animation:bob 2s ease-in-out infinite}.thx p{margin:0}
@keyframes fadein{from{opacity:0}}@keyframes popin{from{transform:scale(.6);opacity:0}}
.note{background:#fff6e3;border:1.5px dashed #e6c27a;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.6;color:#6b5a3a;margin:10px 0;text-align:left}
</style>
</head>

function sparkle(x,y,n){var e=["✦","✧","♡","⋆"];for(var i=0;i<(n||5);i++){var s=document.createElement("span");s.className="spark";s.textContent=e[i%e.length];s.style.left=x+"px";s.style.top=y+"px";s.style.color=["#f08ab8","#b48af0","#7cc9a8","#f0b45a"][i%4];var a=Math.random()*6.28,r=30+Math.random()*30;s.style.setProperty("--dx",Math.cos(a)*r+"px");s.style.setProperty("--dy",Math.sin(a)*r+"px");document.body.appendChild(s);setTimeout(function(t){t.remove()}.bind(null,s),850)}}
function confetti(){setTimeout(function(){try{stickerRain()}catch(e){}},0);if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;var c=["#f7a8cf","#c9a8f0","#9fdcc3","#ffd68a","#a8d0f5"];for(var i=0;i<40;i++){var d=document.createElement("div");d.className="conf";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];document.body.appendChild(d);d.animate([{transform:"translateY(0) rotate(0)",opacity:1},{transform:"translateY("+(innerHeight+40)+"px) translateX("+(Math.random()*120-60)+"px) rotate("+(Math.random()*720)+"deg)",opacity:.9}],{duration:1800+Math.random()*1400,easing:"cubic-bezier(.2,.6,.4,1)",delay:Math.random()*300}).onfinish=function(){this.effect.target.remove()}}}
(function(){var L=[["paw","4%","12%",40,-14],["fish","80%","5%",60,10],["yarn","74%","30%",48,-6],["loaf","-3%","40%",62,6],["paw","88%","54%",34,16],["sleep","1%","70%",64,4],["paw","82%","82%",38,-10],["palette","42%","7%",50,-8],["peek","60%","66%",56,6]];var b=document.querySelector(".bgfx");if(!b)return;L.forEach(function(x,i){var d=document.createElement("div");d.className="flt";d.style.cssText="left:"+x[1]+";top:"+x[2]+";width:"+x[3]+"px;--r:"+x[4]+"deg;--d:"+(6+i%4)+"s;--dl:"+(i*.7)+"s";d.innerHTML=stk(x[0]);b.appendChild(d)})})();
function stickerRain(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;var k=Object.keys(STK);for(var i=0;i<8;i++){var im=document.createElement("img");im.className="rainst";im.alt="";im.src=STK[k[Math.floor(Math.random()*k.length)]];im.style.left=(Math.random()*85)+"vw";document.body.appendChild(im);im.animate([{transform:"translateY(0) rotate(0)"},{transform:"translateY("+(innerHeight+120)+"px) rotate("+(Math.random()*360-180)+"deg)"}],{duration:2200+Math.random()*1200,delay:Math.random()*500,easing:"cubic-bezier(.3,.5,.5,1)"}).onfinish=function(){this.effect.target.remove()}}}
document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".hst");if(t){t.classList.remove("wig");void t.offsetWidth;t.classList.add("wig");var r=t.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/3,10)}});

function toast(m){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function total(){return S.cart.reduce(function(a,i){return a+i.price},0)}
function tlv(i,v){return i+String(v.length).padStart(2,"0")+v}
function crc16(s){var c=65535,i,j;for(i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(j=0;j<8;j++)c=(c&32768)?((c<<1)^4129):(c<<1);c&=65535}return c.toString(16).toUpperCase().padStart(4,"0")}
function ppQR(phone,amt){var t="0066"+phone.replace(/^0/,"");var m=tlv("00","A000000677010111")+tlv("01",t);var p=tlv("00","01")+tlv("01","12")+tlv("29",m)+tlv("53","764")+tlv("54",amt.toFixed(2))+tlv("58","TH")+"6304";p+=crc16(p);var q=qrcode(0,"M");q.addData(p);q.make();return q.createSvgTag(4,0)}
function stTag(s){return s==="approved"?'<span class="tag o">ส่งไฟล์แล้ว</span>':s==="rejected"?'<span class="tag b">ไม่ผ่านการตรวจ</span>':'<span class="tag w">รอตรวจสลิป</span>'}
function fmt(d){return new Date(d).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"})}

async function boot(){
 var r=await sb.auth.getSession();
 await setUser(r.data.session?r.data.session.user:null);
 sb.auth.onAuthStateChange(function(e,s){var u=s?s.user:null;if((u&&u.id)!==(S.user&&S.user.id))setUser(u)});
}
async function setUser(u){
 S.user=u;S.admin=false;S.cart=[];S.tab="shop";
 if(u){
  var a=await sb.from("admins").select("user_id").eq("user_id",u.id).maybeSingle();
  S.admin=!!a.data;
  await loadProducts();
  if(S.pending){var pp=S.products.filter(function(x){return x.id===S.pending})[0];if(pp){S.cart.push(pp);toast("เพิ่มลงตะกร้าแล้ว")}S.pending=null}
 }else{await loadProducts()}
 render();
}
async function loadProducts(){
 var r=await sb.from("products").select("*").order("name");
 S.products=r.data||[];
}
async function loadOrders(){
 var r=await sb.from("orders").select("*, order_items(price, product_id, products(name))").eq("user_id",S.user.id).order("created_at",{ascending:false});
 S.orders=r.data||[];
 var l=await sb.from("product_files").select("product_id, drive_url");
 S.links={};(l.data||[]).forEach(function(x){S.links[x.product_id]=x.drive_url});
}
async function loadAll(){
 var r=await sb.from("orders").select("*, order_items(price, product_id, products(name))").order("created_at",{ascending:false});
 S.all=r.data||[];
 var l=await sb.from("product_files").select("product_id, drive_url");S.links={};(l.data||[]).forEach(function(x){S.links[x.product_id]=x.drive_url});
}
async function go(t){
 S.tab=t;
 if(t==="orders")await loadOrders();
 if(t==="admin")await loadAll();
 if(t==="manage"){S.edit=null;await loadProducts();var lk=await sb.from("product_files").select("product_id, drive_url");S.links={};(lk.data||[]).forEach(function(x){S.links[x.product_id]=x.drive_url})}
 render();
}
function render(){
 var a=$("#app");var _k=(S.user?"u":"g")+S.tab;a.classList.toggle("enter",S._last!==_k);S._last=_k;
 if(!S.user){
  if(S.tab==="login"){a.innerHTML=authView();bindAuth();return}
  a.innerHTML='<div class="top"><div class="brand"><img src="'+LOGO+'" alt="มาสคอตร้าน"><h1>แมวดำตัวอ้วน</h1></div><button class="btn" id="lg">เข้าสู่ระบบ</button></div>'+shopV()+SEA();
  $("#lg").onclick=function(){S.tab="login";S.mode="login";render()};
  bindMain();return}
 var tabs=[["shop","สินค้า"],["cart","ตะกร้า ("+S.cart.length+")"],["orders","คำสั่งซื้อของฉัน"]];
 if(S.admin)tabs.push(["admin","แอดมิน: ตรวจสลิป"],["manage","แอดมิน: จัดการสินค้า"]);
 var nav='<nav>'+tabs.map(function(t){return '<button data-t="'+t[0]+'"'+(S.tab===t[0]||(S.tab==="pay"&&t[0]==="cart")?' aria-current="true"':"")+'>'+t[1]+'</button>'}).join("")+'</nav>';
 var h='<div class="top"><div class="brand"><img src="'+LOGO+'" alt="มาสคอตร้าน"><h1>แมวดำตัวอ้วน</h1></div><button class="btn ghost" id="lo">ออกจากระบบ</button></div><div class="mute" style="margin-bottom:8px">'+esc(S.user.email)+'</div>'+nav;
 h+=({shop:shopV,cart:cartV,pay:payV,orders:ordersV,admin:adminV,manage:manageV}[S.tab]||shopV)();
 a.innerHTML=h+SEA();
 $("#lo").onclick=function(){sb.auth.signOut()};
 $("nav").onclick=function(e){if(e.target.dataset.t)go(e.target.dataset.t)};

function authView(){

 return '<div class="top"><div class="brand"><img src="'+LOGO+'" alt="มาสคอตร้าน"><h1>แมวดำตัวอ้วน</h1></div></div><div class="box authdeco">'+stk("peek","a1")+stk("paw","a2")+'<h2>'+(su?"สมัครสมาชิก":"เข้าสู่ระบบ")+'</h2><p class="mute">'+(S.pending?"เข้าสู่ระบบหรือสมัครสมาชิกด้วยอีเมลเพื่อใส่ตะกร้าและสั่งซื้อ":"ต้องเข้าสู่ระบบด้วยอีเมลก่อนจึงจะสั่งซื้อและรับไฟล์ได้")+'</p><label for="em">อีเมล</label><input id="em" type="email" autocomplete="email"><label for="pw">รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="pw" type="password" autocomplete="'+(su?"new-password":"current-password")+'"><button class="btn" id="go">'+(su?"สมัครสมาชิก":"เข้าสู่ระบบ")+'</button> <button class="btn ghost" id="sw">'+(su?"มีบัญชีแล้ว":"สมัครสมาชิกใหม่")+'</button></div><button class="btn ghost" id="bk">← กลับไปดูสินค้า</button>'
}
function bindAuth(){
 $("#bk").onclick=function(){S.pending=null;S.tab="shop";render()};
 $("#sw").onclick=function(){S.mode=S.mode==="signup"?"login":"signup";render()};
 $("#go").onclick=async function(){
  var e=$("#em").value.trim(),p=$("#pw").value;
  if(e.indexOf("@")<1||p.length<6){toast("กรอกอีเมลและรหัสผ่านให้ครบ (รหัสอย่างน้อย 6 ตัว)");return}
  var r=S.mode==="signup"?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){var em=(r.error.message||"").toLowerCase();toast(em.indexOf("confirm")>=0?"อีเมลนี้ยังไม่ได้ยืนยัน กรุณากดลิงก์ยืนยันในอีเมล (เช็กในจดหมายขยะด้วย) หรือทักร้าน":em.indexOf("rate limit")>=0?"ระบบส่งอีเมลเต็มชั่วคราว กรุณาลองใหม่ภายหลังหรือทักร้าน":S.mode==="signup"?"สมัครไม่สำเร็จ: "+r.error.message:"อีเมลหรือรหัสผ่านไม่ถูกต้อง");return}
  if(S.mode==="signup"&&!r.data.session)toast("สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ");
 };
}

  var pv=(p.preview_url&&p.preview_url.indexOf("http")===0)?'<a class="pv" href="'+esc(p.preview_url)+'" target="_blank" rel="noopener">ดูรูปตัวอย่างเพิ่มเติม ↗</a>':"";

function bindMain(){
 var a=$("#app");
 a.onclick=async function(e){
  var d=e.target.dataset;if(!d)return;
  if(d.add&&!S.user){S.pending=d.add;S.tab="login";S.mode="login";toast("กรุณาเข้าสู่ระบบก่อนใส่ตะกร้า");render();return}
  if(d.add){var p=S.products.filter(function(x){return x.id===d.add})[0];S.cart.push(p);toast("เพิ่มลงตะกร้าแล้ว 🛒");render();var cb=document.querySelector('nav [data-t="cart"]');if(cb){cb.classList.add("bump");var r=cb.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,8)}}
  if(d.rm){S.cart.splice(+d.rm,1);render()}
  if(d.t2)go(d.t2);
  if(d.slip){var r=await sb.storage.from("slips").createSignedUrl(d.slip,300);if(r.data)window.open(r.data.signedUrl,"_blank");else toast("เปิดสลิปไม่ได้")}
  if(d.ok||d.no){var r2=await sb.from("orders").update({status:d.ok?"approved":"rejected"}).eq("id",d.ok||d.no);if(r2.error)toast("บันทึกไม่สำเร็จ: "+r2.error.message);else{toast(d.ok?"อนุมัติแล้ว ลูกค้าจะเห็นลิงก์ไฟล์":"บันทึกแล้ว");if(d.ok)confetti();go("admin")}}
  if(d.cp){try{navigator.clipboard.writeText(d.cp);toast("คัดลอกอีเมลแล้ว")}catch(e){toast(d.cp)}return}
  if(d.lay){S.layout=d.lay;try{localStorage.setItem("layout",d.lay)}catch(e){}render();return}
  if(d.ed){S.edit=d.ed;render();window.scrollTo(0,0)}
  if(d.cv){var inp=$("#cvf");inp.onchange=async function(){var pf=inp.files[0];if(!pf)return;var ex=(pf.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";var cp=Date.now()+"."+ex;var up=await sb.storage.from("covers").upload(cp,pf);if(up.error){toast("อัปโหลดไม่สำเร็จ: "+up.error.message);return}var u=sb.storage.from("covers").getPublicUrl(cp).data.publicUrl;var rr=await sb.from("products").update({image_url:u}).eq("id",d.cv);if(rr.error)toast("บันทึกไม่สำเร็จ: "+rr.error.message);else{toast("เปลี่ยนรูปปกแล้ว");go("manage")}};inp.click()}
  if(d.tg){var p2=S.products.filter(function(x){return x.id===d.tg})[0];await sb.from("products").update({active:!p2.active}).eq("id",d.tg);go("manage")}
 };
 if($("#sp"))$("#sp").onclick=submitOrder;
 if($("#pa"))$("#pa").onclick=addProduct;
 if($("#ec"))$("#ec").onclick=function(){S.edit=null;render()};
 if($("#es"))$("#es").onclick=saveEdit;
}
async function submitOrder(){
 if(S.busy)return;
 var ge=($("#ge").value||"").trim();if(ge.indexOf("@")<1){toast("กรอกอีเมล Google สำหรับรับไฟล์ก่อนนะ");return}
 var f=$("#sl").files[0];
 if(!f){toast("แนบสลิปก่อนส่ง");return}
 S.busy=true;$("#sp").disabled=true;
 try{
  var ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";
  var path=S.user.id+"/"+Date.now()+"."+ext;
  var up=await sb.storage.from("slips").upload(path,f);
  if(up.error)throw up.error;
  var o=await sb.from("orders").insert({user_id:S.user.id,email:S.user.email,drive_email:ge,total:total(),slip_path:path}).select().single();
  if(o.error)throw o.error;
  var it=await sb.from("order_items").insert(S.cart.map(function(x){return {order_id:o.data.id,product_id:x.id,price:x.price}}));
  if(it.error)throw it.error;
  S.cart=[];confetti();(function(){var d=document.createElement("div");d.className="thx";d.innerHTML='<div>'+stk("thanks")+'<p><b>ส่งสลิปแล้ว!</b></p><p class="mute">ร้านจะแชร์ไฟล์ให้ภายใน 24 ชม. 💌</p></div>';d.onclick=function(){d.remove()};document.body.appendChild(d);setTimeout(function(){d.remove()},3800)})();await go("orders");
 }catch(err){toast("ส่งไม่สำเร็จ: "+(err.message||err));$("#sp").disabled=false}
 S.busy=false;
}
async function addProduct(){
 var n=$("#pn").value.trim(),d=$("#pd").value.trim(),p=parseInt($("#pp").value,10),l=$("#pl").value.trim();
 if(!n||!(p>0)||l.indexOf("http")!==0){toast("กรอกชื่อ ราคา และลิงก์ให้ครบ");return}
 var pvu=$("#pv").value.trim();if(pvu&&pvu.indexOf("http")!==0){toast("ลิงก์รูปตัวอย่างต้องขึ้นต้นด้วย http");return}
 var imgUrl=null,pf=$("#pi").files[0];
 if(pf){var ex=(pf.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";var cp=Date.now()+"."+ex;var up=await sb.storage.from("covers").upload(cp,pf);if(up.error){toast("อัปโหลดรูปไม่สำเร็จ: "+up.error.message);return}imgUrl=sb.storage.from("covers").getPublicUrl(cp).data.publicUrl}
 var r=await sb.from("products").insert({name:n,description:d,price:p,image_url:imgUrl,preview_url:pvu||null}).select().single();
 if(r.error){toast("บันทึกไม่สำเร็จ: "+r.error.message);return}
 var r2=await sb.from("product_files").insert({product_id:r.data.id,drive_url:l});
 if(r2.error){toast("บันทึกลิงก์ไม่สำเร็จ: "+r2.error.message);return}
 toast("เพิ่มสินค้าแล้ว");go("manage");
}
async function saveEdit(){
 var id=S.edit,n=$("#en").value.trim(),d=$("#ed").value.trim(),p=parseInt($("#ep").value,10),l=$("#el").value.trim();
 if(!n||!(p>0)||l.indexOf("http")!==0){toast("กรอกชื่อ ราคา และลิงก์ให้ครบ");return}
 var evu=$("#ev").value.trim();if(evu&&evu.indexOf("http")!==0){toast("ลิงก์รูปตัวอย่างต้องขึ้นต้นด้วย http");return}
 var upd={name:n,description:d,price:p,preview_url:evu||null},pf=$("#ei").files[0];
 if(pf){var ex=(pf.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"").toLowerCase()||"jpg";var cp=Date.now()+"."+ex;var up=await sb.storage.from("covers").upload(cp,pf);if(up.error){toast("อัปโหลดรูปไม่สำเร็จ: "+up.error.message);return}upd.image_url=sb.storage.from("covers").getPublicUrl(cp).data.publicUrl}
 var r=await sb.from("products").update(upd).eq("id",id);
 if(r.error){toast("บันทึกไม่สำเร็จ: "+r.error.message);return}
 var ex2=await sb.from("product_files").select("product_id").eq("product_id",id).maybeSingle();
 var r2=ex2.data?await sb.from("product_files").update({drive_url:l}).eq("product_id",id):await sb.from("product_files").insert({product_id:id,drive_url:l});
 if(r2.error){toast("บันทึกลิงก์ไม่สำเร็จ: "+r2.error.message);return}
 toast("บันทึกแล้ว");go("manage");
}
boot();
</script>
</body>
